name: Terraform Import

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to import (staging, preprod, prod)"
        required: true
        default: "staging"

jobs:
  terraform-import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -backend-config="env/backend.${{ github.event.inputs.environment }}.tfvars"

      - name: Terraform Import ECS Role
        run: terraform import module.ecs.aws_iam_role.ecs_task_execution nest-api-${{ github.event.inputs.environment }}-ecs-task-exec-role
