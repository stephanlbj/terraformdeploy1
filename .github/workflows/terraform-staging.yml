name: Terraform Apply

on:
  push:
    branches:
      - main
      - staging
      - preprod
  workflow_run:
    workflows: ["Terraform Import"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy (staging, preprod, prod)"
        required: true
        default: "staging"

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Clean previous Terraform state
        run: rm -rf .terraform

      - name: Determine environment
        id: env
        run: |
          if [[ "${GITHUB_REF_NAME}" == "staging" ]]; then
            echo "environment=staging" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF_NAME}" == "preprod" ]]; then
            echo "environment=preprod" >> $GITHUB_ENV
          else
            echo "environment=main" >> $GITHUB_ENV
          fi

      - name: Terraform Init
        run: terraform init -backend-config="env/backend.${{ env.environment }}.tfvars"

      - name: Terraform Plan
        run: terraform plan -var-file="env/${{ env.environment }}.tfvars"

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file="env/${{ env.environment }}.tfvars"
