name: Terraform Import and Apply

on:
  push:
    branches:
      - main
      - staging
      - preprod
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy (staging, preprod, prod)"
        required: true
        default: "staging"

jobs:
  import:
    name: Terraform Import ECS Role and OIDC Provider
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' # ne s'exécute que si déclenché manuellement
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -backend-config="env/backend.${{ github.event.inputs.environment }}.tfvars"

      - name: Import ECS Role if not present
        run: |
          if ! terraform state list | grep -q 'module.ecs.aws_iam_role.ecs_task_execution'; then
            terraform import \
              -var-file="env/${{ github.event.inputs.environment }}.tfvars" \
              module.ecs.aws_iam_role.ecs_task_execution \
              nest-api-${{ github.event.inputs.environment }}-ecs-task-exec-role
          else
            echo "ECS Role already imported in state, skipping import."
          fi

      - name: Import OIDC Provider if not present
        run: |
          if ! terraform state list | grep -q 'module.iam_app_staging.aws_iam_openid_connect_provider.github'; then
            terraform import \
              -var-file="env/${{ github.event.inputs.environment }}.tfvars" \
              module.iam_app_staging.aws_iam_openid_connect_provider.github \
              arn:aws:iam::585665041354:oidc-provider/token.actions.githubusercontent.com
          else
            echo "OIDC Provider already imported in state, skipping import."
          fi

  apply:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    needs: import # attend la fin du job "import" si déclenché manuellement
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Clean previous Terraform state
        run: rm -rf .terraform

      - name: Determine environment
        id: env
        run: |
          ENV="${{ github.event.inputs.environment }}"
          echo "environment=$ENV" >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform init -backend-config="env/backend.${{ env.environment }}.tfvars"

      - name: Terraform Plan
        run: terraform plan -var-file="env/${{ env.environment }}.tfvars"

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file="env/${{ env.environment }}.tfvars"
